name: Build and standards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Release build and formatting
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore JussiMiniPos.csproj

      - name: Verify formatting and code style
        run: dotnet format JussiMiniPos.csproj --verify-no-changes --no-restore --verbosity minimal

      - name: Build with warnings as errors
        run: dotnet build JussiMiniPos.csproj --configuration Release --no-restore --property:ContinuousIntegrationBuild=true --warnaserror

  nuget-audit:
    name: NuGet vulnerability audit
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Audit direct and transitive packages
        run: >-
          dotnet restore JussiMiniPos.csproj
          --property:NuGetAudit=true
          --property:NuGetAuditMode=all
          --property:NuGetAuditLevel=low
          --property:TreatWarningsAsErrors=true

      - name: Print vulnerability report
        run: >-
          dotnet package list
          --project JussiMiniPos.csproj
          --vulnerable
          --include-transitive
          --no-restore
