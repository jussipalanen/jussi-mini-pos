name: Build and standards

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets, so a PR stacked on another
  # branch is checked too; pushes are built on main only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Release build and formatting
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore JussiMiniPos.slnx

      - name: Verify formatting and code style
        run: dotnet format JussiMiniPos.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build with warnings as errors
        run: dotnet build JussiMiniPos.slnx --configuration Release --no-restore --property:ContinuousIntegrationBuild=true --warnaserror

  dev-containers:
    name: Development containers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: |
          bash -n dev
          sh -n docker/api/entrypoint.sh

      - name: Start development stack
        run: ./dev up

      - name: Verify HTTPS and command lifecycle
        run: |
          curl --fail --silent --insecure https://localhost:7240/api/v1/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl --fail --silent --insecure --location https://localhost:7240/docs > /dev/null
          ./dev status
          certificate="$(docker compose exec -T api openssl x509 -in /https/localhost.crt -noout -fingerprint)"
          printf 'no\n' | ./dev reset
          curl --fail --silent --insecure https://localhost:7240/api/v1/health > /dev/null
          ./dev restart
          test "$certificate" = "$(docker compose exec -T api openssl x509 -in /https/localhost.crt -noout -fingerprint)"
          curl --fail --silent --insecure https://localhost:7240/api/v1/health > /dev/null
          ./dev down
          test -z "$(docker compose ps --all --quiet)"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes

  api-tests:
    name: API tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Build only the API and Core dependency graph; WPF stays Windows-only.
      - name: Restore API test dependencies
        run: dotnet restore tests/JussiMiniPos.Api.Tests/JussiMiniPos.Api.Tests.csproj

      - name: Run API tests
        run: dotnet test --project tests/JussiMiniPos.Api.Tests/JussiMiniPos.Api.Tests.csproj --configuration Release --no-restore

  tests:
    name: Tests on SQLite and PostgreSQL
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The Windows runner image ships PostgreSQL with its service stopped,
      # and sets PGBIN, PGUSER and PGPASSWORD for it.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*'
          Set-Service -InputObject $service -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready" --host localhost --timeout 60
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not become ready.' }
          "JUSSIMINIPOS_TEST_POSTGRES=Host=localhost;Port=5432;Username=$env:PGUSER;Password=$env:PGPASSWORD;Database=postgres" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore JussiMiniPos.slnx

      - name: Build
        run: dotnet build JussiMiniPos.slnx --configuration Release --no-restore --property:ContinuousIntegrationBuild=true

      # Required, so a PostgreSQL that failed to start fails the run instead
      # of quietly skipping half of the tests.
      - name: Run tests
        env:
          JUSSIMINIPOS_TEST_REQUIRE_POSTGRES: "true"
        run: dotnet test --solution JussiMiniPos.slnx --configuration Release --no-build

  nuget-audit:
    name: NuGet vulnerability audit
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Audit direct and transitive packages
        run: >-
          dotnet restore JussiMiniPos.slnx
          --property:NuGetAudit=true
          --property:NuGetAuditMode=all
          --property:NuGetAuditLevel=low
          --property:TreatWarningsAsErrors=true

      - name: Print vulnerability report
        run: >-
          dotnet package list
          --project JussiMiniPos.slnx
          --vulnerable
          --include-transitive
          --no-restore
