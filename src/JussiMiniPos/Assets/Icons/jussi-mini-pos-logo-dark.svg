<text x="30" y="41" text-anchor="middle" font-family="'Anthropic Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="500" fill="#FFFFFF">J</text>
<text x="76" y="30" font-family="'Anthropic Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="500" fill="#F5F5F4">Jussi</text>
<text x="76" y="52" font-family="'Anthropic Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#2DD4BF">mini-POS</text>
